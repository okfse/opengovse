<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">opengov.se</a>
    <a class="ok-link" href="https://okfn.se/">Open Knowledge Sverige</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Meny</button>
    <nav class="site-nav" id="site-nav" aria-label="Huvudnavigering">
      <ul>
        {% for item in site.data.navigation %}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if page.url == item.url or page.permalink == item.url %}aria-current="page"{% endif %}>
            {{ item.title }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
